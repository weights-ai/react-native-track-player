name: validate
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should-build-docs: ${{ steps.filter.outputs.docs || steps.filter.outputs.workflow }}
      should-build-ios: ${{ steps.filter.outputs.ios || steps.filter.outputs.workflow || steps.filter.outputs.js }}
      should-build-android: ${{ steps.filter.outputs.android || steps.filter.outputs.workflow || steps.filter.outputs.js }}
      should-check-types: ${{ steps.filter.outputs.js || steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/validate.yml'
            js:
              - '.node-version'
              - '.eslintrc.js'
              - '.prettierrc.js'
              - 'package.json'
              - 'tsconfig.json'
              - 'yarn.lock'
              - 'src/**'
              - 'example/src/**'
              - 'example/**.json'
              - 'example/**.js'
            ios:
              - 'ios/**'
              - 'example/ios/**'
            android:
              - 'android/**'
              - 'example/android/**'
            docs:
              - 'docs/**'
  check-typescript:
    runs-on: ubuntu-latest
    needs: check-changes
    steps:
      - name: Checkout Repo
        if: ${{ needs.check-changes.outputs.should-check-types }}
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: ${{ needs.check-changes.outputs.should-check-types }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable Yarn
        if: ${{ needs.check-changes.outputs.should-check-types }}
        run: npm install --global corepack@0.36.0 --force && corepack enable
      - name: Install Dependencies
        if: ${{ needs.check-changes.outputs.should-check-types }}
        run: |-
          yarn install --immutable
      - name: Install Example Dependencies
        if: ${{ needs.check-changes.outputs.should-check-types }}
        run: |-
          cd example
          yarn install --immutable
      - name: Check Lint, Format & Types
        if: ${{ needs.check-changes.outputs.should-check-types }}
        run: |
          yarn run ci:lint
          yarn run ci:format
          yarn run types
      - name: Example - Check Lint, Format & Types
        if: ${{ needs.check-changes.outputs.should-check-types }}
        run: |
          cd example
          yarn run ci:lint
          yarn run ci:format
          yarn run types
  build-ios:
    runs-on: macos-15
    needs: check-changes
    steps:
      - name: Checkout Repo
        if: ${{ needs.check-changes.outputs.should-build-ios }}
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: ${{ needs.check-changes.outputs.should-build-ios }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable Yarn
        if: ${{ needs.check-changes.outputs.should-build-ios }}
        run: npm install --global corepack@0.36.0 --force && corepack enable
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.6.9'
      - name: Install Library Dependencies
        if: ${{ needs.check-changes.outputs.should-build-ios }}
        run: yarn install --immutable
      - name: Build Library
        if: ${{ needs.check-changes.outputs.should-build-ios }}
        run: yarn build
      - name: Install Example Dependencies
        if: ${{ needs.check-changes.outputs.should-build-ios }}
        run: |-
          cd example
          yarn install --immutable
      - name: Bundle Install
        if: ${{ needs.check-changes.outputs.should-build-ios }}
        run: |-
          cd example/ios
          bundle config set --local path 'vendor/bundle'
          bundle install
      - name: Cache Cocoapods Dependencies
        if: ${{ needs.check-changes.outputs.should-build-ios }}
        uses: buildjet/cache@v4
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Install Cococapods
        if: ${{ needs.check-changes.outputs.should-build-ios }}
        run: |-
          cd example/ios
          bundle exec pod install
      - name: Build App
        if: ${{ needs.check-changes.outputs.should-build-ios }}
        run: |-
          cd example/ios
          set -o pipefail && xcodebuild build -workspace example.xcworkspace -scheme example -destination 'generic/platform=iOS Simulator' | xcbeautify --renderer github-actions
  build-android:
    runs-on: ubuntu-latest
    needs: check-changes
    steps:
      - name: Checkout Repo
        if: ${{ needs.check-changes.outputs.should-build-android }}
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: ${{ needs.check-changes.outputs.should-build-android }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable Yarn
        if: ${{ needs.check-changes.outputs.should-build-android }}
        run: npm install --global corepack@0.36.0 --force && corepack enable
      - name: Install Library Dependencies
        if: ${{ needs.check-changes.outputs.should-build-android }}
        run: yarn install --immutable
      - name: Build Library
        if: ${{ needs.check-changes.outputs.should-build-android }}
        run: yarn build
      - name: Install Mobile Dependencies
        if: ${{ needs.check-changes.outputs.should-build-android }}
        run: |-
          cd example
          yarn install
      - name: Setup Java
        if: ${{ needs.check-changes.outputs.should-build-android }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle Wrapper
        if: ${{ needs.check-changes.outputs.should-build-android }}
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Cache Gradle Dependencies
        if: ${{ needs.check-changes.outputs.should-build-android }}
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-
      - name: Build App
        if: ${{ needs.check-changes.outputs.should-build-android }}
        run: |-
          cd example/android
          ./gradlew assembleDebug --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
  build-docs:
    runs-on: ubuntu-latest
    needs: check-changes
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout Repo
        if: ${{ needs.check-changes.outputs.should-build-docs }}
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: ${{ needs.check-changes.outputs.should-build-docs }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable Yarn
        if: ${{ needs.check-changes.outputs.should-build-docs }}
        run: npm install --global corepack@0.36.0 --force && corepack enable
      - name: Install Dependencies
        if: ${{ needs.check-changes.outputs.should-build-docs }}
        run: |-
          yarn install --immutable
      - name: Build Docs
        if: ${{ needs.check-changes.outputs.should-build-docs }}
        run: |-
          yarn build
